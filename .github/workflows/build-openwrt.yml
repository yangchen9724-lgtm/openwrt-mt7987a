# ============================================================
# ImmortalWrt 云编译工作流 — Hiveton H5000M (MT7987A / Filogic 860)
# 触发方式：
#   1. 手动：GitHub 仓库页面 → Actions → "编译 ImmortalWrt (H5000M)" → Run workflow
#   2. 自动：推送修改 config.seed 或本文件到 main 分支
# 编译时间：首次约 1.5~3 小时（GitHub 免费 Runner 2 核）
# ============================================================
name: 编译 ImmortalWrt (H5000M)

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "config.seed"
      - ".github/workflows/build-openwrt.yml"

concurrency:
  group: build-openwrt
  cancel-in-progress: false

jobs:
  build:
    name: ImmortalWrt master · mediatek/filogic · hiveton_h5000m
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/lib/jvm
          sudo apt-get clean
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            autoconf automake libtool cmake \
            gettext git libncurses5-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: 拉取 ImmortalWrt 源码并集成第三方插件源码
        run: |
          # Hiveton H5000M 在 ImmortalWrt master 官方支持（设备 hiveton_h5000m），社区 CI 每日编译验证
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git
          # 1) 拼拼WiFi/Wiwiz 开源插件源码（官方仓库，若克隆失败可换 gitee 镜像）
          git clone --depth 1 https://github.com/wiwizcom/WiFiPortal.git
          # 备用镜像：git clone --depth 1 https://gitee.com/wiwiz/WiFiPortal.git
          # 2) H5000M 专属插件（FAN789 维护）：PWM 风扇温控 + 5G/有线网络模式切换
          git clone --depth 1 https://github.com/FAN789/luci-app-h5000m-fancontrol.git
          git clone --depth 1 https://github.com/FAN789/luci-app-h5000m-netmode.git
          cd immortalwrt
          # 3) 5G 模组管理栈（巴龙哥 QModem）：以官方 feeds 方式集成（含 luci-app-qmodem-next 纯JS界面 +
          #    qmodem 核心 + qmodem-smsd 短信服务 + sms-forwarder-next 短信转发 + driver 厂商驱动）
          echo "src-git qmodem https://github.com/FUjr/QModem.git;main" >> feeds.conf.default
          # 4) 科学上网（PassWall2）：官方两个 feed（界面 + 依赖核心包 xray/sing-box 等）
          #    注：PassWall 全家桶已迁移至 Openwrt-Passwall 组织（旧 xiaorouji 地址已失效）
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
          echo "src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main" >> feeds.conf.default
          cp -r ../WiFiPortal/dcc2-wiwiz package/
          cp -r ../WiFiPortal/eqos-master-wiwiz package/
          cp -r ../WiFiPortal/wifidog-wiwiz package/
          [ -d ../WiFiPortal/autokick-wiwiz ] && cp -r ../WiFiPortal/autokick-wiwiz package/
          cp -r ../luci-app-h5000m-fancontrol package/
          cp -r ../luci-app-h5000m-netmode package/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 写入编译配置并校验关键项
        run: |
          cd immortalwrt
          # ===== 网络硬件加速：能力已编译（WED/PPE 内核支持），默认关闭硬件分载 =====
          # 说明：科学上网（PassWall2 tproxy 分流）与 Portal 认证需要流量经过 netfilter，
          #       硬件分载（flow_offloading_hw）会绕过规则导致分流失效/认证页不弹出，
          #       因此默认仅保留 ImmortalWrt 自带软件分载；需要极限转发时再手动开启。
          mkdir -p files/etc/uci-defaults
          echo '#!/bin/sh' > files/etc/uci-defaults/99-enable-offload
          echo '# 默认关闭硬件流量分载（兼容科学上网 tproxy 分流与拼拼WiFi Portal 认证）' >> files/etc/uci-defaults/99-enable-offload
          echo "uci -q set firewall.@defaults[0].flow_offloading_hw='0'" >> files/etc/uci-defaults/99-enable-offload
          echo 'uci commit firewall' >> files/etc/uci-defaults/99-enable-offload
          echo 'exit 0' >> files/etc/uci-defaults/99-enable-offload
          chmod +x files/etc/uci-defaults/99-enable-offload
          cp ../config.seed .config
          make defconfig
          echo "===== TARGET 配置段 ====="
          grep -E 'CONFIG_TARGET_(mediatek|.*PROFILE)' .config || true
          # 单独校验目标设备：ImmortalWrt master 用 CONFIG_TARGET_PROFILE 指定单设备
          if grep -q '^CONFIG_TARGET_PROFILE="DEVICE_hiveton_h5000m"' .config; then
            echo "OK    CONFIG_TARGET_PROFILE=DEVICE_hiveton_h5000m"
          else
            echo "MISSING  CONFIG_TARGET_PROFILE=DEVICE_hiveton_h5000m"
            exit 1
          fi
          echo "===== 关键配置校验（缺一项即中止） ====="
          for sym in \
            CONFIG_TARGET_mediatek_filogic \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_kmod-mt7992-23-firmware \
            CONFIG_PACKAGE_kmod-nft-offload \
            CONFIG_PACKAGE_kmod-usb-serial-option \
            CONFIG_PACKAGE_luci-proto-qmi \
            CONFIG_PACKAGE_wifidog-wiwiz \
            CONFIG_PACKAGE_luci-app-eqos \
            CONFIG_PACKAGE_dcc2-wiwiz-nossl \
            CONFIG_PACKAGE_luci-app-qmodem-next \
            CONFIG_PACKAGE_qmodem \
            CONFIG_PACKAGE_qmodem-smsd \
            CONFIG_PACKAGE_sms-forwarder-next \
            CONFIG_PACKAGE_luci-app-h5000m-fancontrol \
            CONFIG_PACKAGE_luci-app-h5000m-netmode \
            CONFIG_PACKAGE_luci-app-passwall2 \
            CONFIG_PACKAGE_dnsmasq-full \
            CONFIG_PACKAGE_kmod-tun; do
            if grep -q "^${sym}=y" .config; then
              echo "OK    ${sym}"
            else
              echo "MISSING  ${sym}"
              exit 1
            fi
          done

      - name: 编译固件（失败时自动降为单线程重试并输出完整日志）
        run: |
          cd immortalwrt
          make -j$(nproc) || make -j1 V=s
          df -h

      - name: 收集产物
        run: |
          mkdir -p artifacts
          cp -r immortalwrt/bin/targets/mediatek/filogic/* artifacts/
          cp immortalwrt/.config artifacts/build-config.txt
          echo "===== 产物清单 ====="
          ls -lh artifacts/
          echo "===== sha256 校验 ====="
          sha256sum artifacts/* 2>/dev/null | sort

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-h5000m-master
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
